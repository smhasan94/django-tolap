[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sqlalchemy-tolap"
version = "0.1.0.dev0"
description = "TOLAP policies enforced on SQLAlchemy Select statements with ORM-native pushdown"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Sharukh Hasan" }]
keywords = ["sqlalchemy", "tolap", "access-control", "ai-agents", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "SQLAlchemy>=2.0,<2.2",
  "tolap-core>=1.0,<2",
]

[project.urls]
Homepage = "https://github.com/smhasan94/django-tolap"

[tool.hatch.build.targets.wheel]
packages = ["sqlalchemy_tolap"]
