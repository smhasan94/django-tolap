name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        django: ["5.2", "6.0", "6.1"]
        exclude:
          - python: "3.11"
            django: "6.0"
          - python: "3.11"
            django: "6.1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv pip install "Django~=${{ matrix.django }}.0"
      - run: make lint
      - run: make type
      - run: make test

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: make test
      - name: Gap report is current
        run: |
          PYTHONPATH=. uv run python -m tests.gap.report > /tmp/gap-report.md
          diff -u docs/gap-report.md /tmp/gap-report.md

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tolap
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -uroot -proot --silent" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/tolap
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update -q && sudo apt-get install -y -q default-libmysqlclient-dev pkg-config
      - run: uv sync --frozen
      - run: make test

  quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: scripts/quickstart_check.sh
      - run: ROWS=100000 make demo

  upstream-main:
    # Installs tolap-core/tolap-store/tolap-mcp from upstream main instead of PyPI 1.0.0
    # to catch API drift before a release does. Allowed to fail; the summary names it.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: |
          uv pip install --reinstall \
            "tolap-core @ git+https://github.com/awslabs/tolap#subdirectory=sdk/python/tolap-core" \
            "tolap-store @ git+https://github.com/awslabs/tolap#subdirectory=sdk/python/tolap-store" \
            "tolap-mcp @ git+https://github.com/awslabs/tolap#subdirectory=sdk/python/tolap-mcp"
      - run: uv run python -c "import tolap_core, importlib.metadata as m; print('tolap-core', m.version('tolap-core'))"
      - run: make test
